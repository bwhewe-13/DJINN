name: Tests

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.15 intentionally excluded: CPython 3.15 isn't final yet (RC as of
        # 2026-09) and PyTorch has no stable cp315 wheels (nightly-only; see
        # pytorch/pytorch#184352). Add "3.15" once a stable torch release
        # supports it.
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install package + test dependencies
        run: python -m pip install -e .[testing]

      - name: Run tests
        run: pytest -q --cov=djinn --cov-report=xml

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: ./coverage.xml
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: bwhewe-13/DJINN
