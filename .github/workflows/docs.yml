name: Docs

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  docs:
    runs-on: ubuntu-26.04

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install package + docs dependencies
        run: python -m pip install -e . sphinx sphinx-rtd-theme

      - name: Build Sphinx HTML
        run: python -m sphinx -M html docs docs/_build
